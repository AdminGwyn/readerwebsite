<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản trị — Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    (function () {
      var t = localStorage.getItem("reader_ui_theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body class="admin-page">
  <div class="noise" aria-hidden="true"></div>

  <header class="shell site-header">
    <span class="logo">Reader<span>.</span> Quản trị</span>
    <div class="header-actions">
      <a class="btn btn-ghost" href="index.html">Trang chủ</a>
      <a class="btn btn-ghost" href="reader.html">Trình đọc</a>
      <button type="button" class="btn btn-ghost" id="btn-logout">Đăng xuất</button>
    </div>
  </header>

  <main class="adm-wrap">
    <div class="adm-head">
      <div>
        <h1 style="margin: 0 0 0.35rem; font-size: 1.35rem">Sách & mục lục</h1>
        <p class="muted" style="margin: 0">Nội dung lưu trong trình duyệt (localStorage).</p>
      </div>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
        <button type="button" class="btn btn-primary" id="btn-new">+ Tài liệu mới</button>
        <button type="button" class="btn btn-ghost" id="btn-export">Xuất JSON</button>
        <label class="btn btn-ghost" style="cursor: pointer; margin: 0">
          Nhập JSON
          <input type="file" id="import-file" accept="application/json" hidden />
        </label>
      </div>
    </div>

    <div class="adm-card">
      <h2 style="margin-top: 0; font-size: 1.05rem">Đã lưu</h2>
      <div style="overflow: auto">
        <table class="adm-list" id="story-table">
          <thead>
            <tr>
              <th>Tên</th>
              <th>Thể loại</th>
              <th>Chương</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="adm-card">
      <h2 style="margin-top: 0; font-size: 1.05rem" id="editor-title">Biên tập</h2>
      <form id="story-form">
        <input type="hidden" id="f-id" />
        <div class="adm-grid">
          <div class="adm-field">
            <label for="f-title">Tên *</label>
            <input id="f-title" required />
          </div>
          <div class="adm-field">
            <label for="f-subtitle">Phụ đề</label>
            <input id="f-subtitle" placeholder="Tuỳ chọn" />
          </div>
          <div class="adm-field">
            <label for="f-author">Tác giả *</label>
            <input id="f-author" required />
          </div>
          <div class="adm-field">
            <label for="f-publisher">NXB</label>
            <input id="f-publisher" />
          </div>
          <div class="adm-field">
            <label for="f-category">Thể loại</label>
            <select id="f-category"></select>
          </div>
          <div class="adm-field">
            <label for="f-newcat">Thể loại mới</label>
            <input id="f-newcat" placeholder="Tuỳ chọn" />
          </div>
        </div>
        <div class="adm-field" style="margin-top: 0.65rem">
          <label for="f-synopsis">Tóm tắt</label>
          <textarea id="f-synopsis" rows="3"></textarea>
        </div>
        <div class="adm-field" style="margin-top: 0.65rem">
          <label for="f-cover-file">Ảnh bìa</label>
          <input type="file" id="f-cover-file" accept="image/*" />
          <p class="muted" style="margin: 0.35rem 0 0">Để trống = ảnh mặc định.</p>
          <input type="hidden" id="f-cover" />
        </div>

        <h3 style="font-size: 1rem; margin: 1.25rem 0 0.5rem">Chương</h3>
        <p class="muted" style="margin-top: 0">Nội dung HTML mỗi chương.</p>
        <div id="chapters-root"></div>
        <button type="button" class="btn btn-ghost" id="btn-add-ch" style="margin-top: 0.5rem">+ Chương</button>

        <div style="margin-top: 1.25rem; display: flex; gap: 0.5rem; flex-wrap: wrap">
          <button type="submit" class="btn btn-primary">Lưu</button>
          <button type="button" class="btn btn-ghost" id="btn-preview">Xem trước</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { initTheme } from "./js/theme.js";
    initTheme();
  </script>
  <script type="module" src="js/admin-page.js"></script>
</body>
</html>
