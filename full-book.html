<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toàn văn: Hình Vẽ Thông Minh — PDF</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; padding: 0; background: #0f0f16; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .pdf-header { height: 60px; background: #111118; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .btn-back { color: var(--accent); text-decoration: none; font-family: 'Inter', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .pdf-container { flex: 1; width: 100%; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header class="pdf-header">
    <a href="index.html" class="btn-back">
      <i class="fas fa-arrow-left"></i> Quay lại trang chủ
    </a>
    <div style="color: white; font-family: 'Inter', sans-serif; font-weight: 700;">HÌNH VẼ THÔNG MINH (BẢN GỐC 418 TRANG)</div>
    <a href="Hình-Vẽ-Thông-Minh-Dan-Roam.pdf" download class="btn-back" style="background: var(--accent); color: #000; padding: 6px 16px; border-radius: 20px;">Tải xuống PDF</a>
  </header>
  <div class="pdf-container">
    <iframe src="Hình-Vẽ-Thông-Minh-Dan-Roam.pdf#toolbar=1" type="application/pdf"></iframe>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
</body>
</html>
