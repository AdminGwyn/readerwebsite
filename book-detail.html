<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sách — E-Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    (function () {
      var t = localStorage.getItem("reader_ui_theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="shell site-header">
    <a class="logo" href="index.html"><span>📖</span> E-Book</a>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Trang chủ</a>
      <a href="about.html" class="nav-link">Giới thiệu</a>
      <a href="author.html" class="nav-link">Tác giả</a>
      <a href="publisher.html" class="nav-link">Nhà xuất bản</a>
      <a href="contact.html" class="nav-link">Liên hệ</a>
    </nav>
    <div class="header-actions">
      <button type="button" class="btn btn-icon" id="theme-toggle" title="Giao diện">🌙</button>
    </div>
  </header>

  <main>
    <section class="shell book-detail-section">
      <div class="book-detail-grid">
        <div class="book-cover-col">
          <div class="book-cover-large" id="detail-cover" style="background: linear-gradient(135deg, #1d7658, #0a4d36);">
             <span id="detail-cover-text">Tài Liệu Học Tập</span>
          </div>
          <div class="book-rating">
            <span class="stars">★★★★★</span>
            <span class="rating-text">5 sao - Giáo trình</span>
          </div>
        </div>
        <div class="book-info-col">
          <h1 id="detail-title">Đang tải...</h1>
          <p class="book-subtitle" id="detail-subtitle">Sách chuyên ngành</p>
          
          <div class="book-meta-grid">
            <div class="meta-item">
              <span class="meta-label">TÁC GIẢ</span>
              <strong id="detail-author">Trường ĐH ABC</strong>
            </div>
            <div class="meta-item">
              <span class="meta-label">NHÀ XUẤT BẢN</span>
              <strong id="detail-publisher">NXB Trí Thức</strong>
            </div>
            <div class="meta-item">
              <span class="meta-label">THỂ LOẠI</span>
              <strong id="detail-genre">Giáo trình, Kinh tế</strong>
            </div>
            <div class="meta-item">
              <span class="meta-label">SỐ TRANG</span>
              <strong id="detail-pages">272 trang</strong>
            </div>
          </div>

          <div class="book-actions">
            <a href="reader.html" class="btn btn-primary btn-read-now" id="btn-read-now">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
              Đọc sách ngay
            </a>
            <button type="button" class="btn btn-icon btn-secondary">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
            <button type="button" class="btn btn-icon btn-secondary">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="shell site-footer">
    <p>E-Book — demo đọc sách front-end. © <span id="year"></span></p>
  </footer>

  <script type="module" src="js/landing.js"></script>
  <script type="module">
    import { getStoryById, loadLibrary } from "./js/store.js";
    const params = new URLSearchParams(location.search);
    const idParam = params.get("id");
    let story = getStoryById(idParam) ?? loadLibrary().stories[0] ?? null;
    
    if (story) {
      document.getElementById("detail-title").textContent = story.title;
      document.getElementById("detail-cover-text").textContent = story.title;
      document.getElementById("detail-author").textContent = story.author || "Đang cập nhật";
      document.getElementById("detail-publisher").textContent = story.publisher || "Đang cập nhật";
      document.getElementById("btn-read-now").href = `reader.html?id=${story.id || idParam}`;
      
      // If it's a dummy novel ID that doesn't exist in store, set some default texts
      if (idParam && idParam.startsWith("novel")) {
        const titleMap = {
          "novel1": ["Tiên Nghịch", "Nhĩ Căn", "Tiên Hiệp", "1200 trang"],
          "novel2": ["Phàm Nhân Tu Tiên", "Vong Ngữ", "Tiên Hiệp", "1500 trang"],
          "novel3": ["Đấu Phá Thương Khung", "Thiên Tằm Thổ Đậu", "Huyền Huyễn", "1300 trang"],
          "novel4": ["Thế Giới Hoàn Mỹ", "Thần Đông", "Huyền Huyễn", "1400 trang"],
          "novel5": ["Kiếm Lai", "Phong Hỏa Hí Chư Hầu", "Tiên Hiệp", "2000 trang"],
          "novel6": ["Già Thiên", "Thần Đông", "Huyền Huyễn", "1800 trang"]
        };
        const info = titleMap[idParam];
        if (info) {
          document.getElementById("detail-title").textContent = info[0];
          document.getElementById("detail-cover-text").textContent = info[0];
          document.getElementById("detail-author").textContent = info[1];
          document.getElementById("detail-genre").textContent = info[2];
          document.getElementById("detail-pages").textContent = info[3];
          document.getElementById("detail-subtitle").textContent = "Tiểu thuyết mạng";
        }
      }
    }
  </script>
</body>
</html>
